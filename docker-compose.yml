version: '3.8'

services:
  # FastAPI backend service
  api:
    build: .
    container_name: rag-chatbot-api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - LLM_MODEL=llama-3.3-70b-versatile
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - RETRIEVAL_K=5
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./vectordb:/app/vectordb
      - ./logs:/app/logs
    command: uvicorn api.fastapi_app:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit UI service
  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: rag-chatbot-ui
    ports:
      - "8501:8501"
    environment:
      - API_ENDPOINT=http://api:8000
    depends_on:
      - api
    volumes:
      - ./data:/app/data
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  data:
  vectordb:
  logs:

networks:
  default:
    name: rag-chatbot-network
